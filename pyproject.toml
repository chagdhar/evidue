[project]
name = "evidue"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "sqlalchemy>=2.0", "python-multipart>=0.0.18"]
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
ignore = ["DTZ001"]
