name: Deploy Cloud Run

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  SERVICE: evidue-demo
  ARTIFACT_REPOSITORY: evidue

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv run ruff format --check backend
      - run: uv run ruff check backend
      - run: uv run pytest backend/tests
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run test && npm run build
        working-directory: frontend

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the container image
        run: |
          image="$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$ARTIFACT_REPOSITORY/$SERVICE:$GITHUB_SHA"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build \
            --build-arg "VITE_POSTHOG_KEY=${{ vars.VITE_POSTHOG_KEY }}" \
            --build-arg "VITE_POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}" \
            --tag "$image" .
          docker push "$image"

      - name: Deploy to Cloud Run
        run: |
          image="$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$ARTIFACT_REPOSITORY/$SERVICE:$GITHUB_SHA"
          gcloud run deploy "$SERVICE" \
            --image "$image" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "$REGION" \
            --allow-unauthenticated \
            --min-instances "${{ vars.CLOUD_RUN_MIN_INSTANCES || '0' }}" \
            --max-instances 3 \
            --cpu 1 \
            --memory 1Gi \
            --concurrency 40 \
            --timeout 60 \
            --cpu-boost \
            --port 8080 \
            --service-account "evidue-runtime@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-env-vars "EVIDUE_PUBLIC_DEMO=true,EVIDUE_DB_PATH=/app/data/evidue.db,POSTHOG_HOST=${{ vars.VITE_POSTHOG_HOST }}" \
            --startup-probe "httpGet.path=/api/health,httpGet.port=8080,initialDelaySeconds=0,timeoutSeconds=5,periodSeconds=10,failureThreshold=10"

      - name: Smoke test deployed public demo
        run: |
          service_url="$(gcloud run services describe "$SERVICE" --project "${{ secrets.GCP_PROJECT_ID }}" --region "$REGION" --format='value(status.url)')"
          curl --fail --silent --show-error "$service_url/api/health"
          curl --fail --silent --show-error "$service_url/api/demo/status" | jq -e '.public_demo == true and .reconciled == true'
          curl --fail --silent --show-error "$service_url/api/contracts/current" | jq -e '.compilation.status == "approved"'
          curl --fail --silent --show-error "$service_url/api/reconciliations/current" | jq -e '.claimed_outcomes == 10000 and .confirmed_payable_amount == "12480.00" and .recommended_deduction == "2520.00"'
          curl --fail --silent --show-error "$service_url/api/reconciliations/current/outcomes/OUT-004821" | jq -e '.rule_id == "R3"'
          curl --fail --silent --show-error -X POST "$service_url/api/public-demo/rules/validate" | jq -e '.valid == true'
          curl --fail --silent --show-error -X POST "$service_url/api/public-demo/outcomes/OUT-004821/evaluate" | jq -e '.rule_id == "R3"'
          curl --fail --silent --show-error "$service_url/demo/invoices/current?outcome=OUT-004821" >/dev/null
