services:
  - type: web
    name: evidue-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: EVIDUE_DB_PATH
        value: /app/data/evidue.db
      - key: EVIDUE_PUBLIC_DEMO
        value: "true"
      # Add GEMINI_API_KEY in the Render dashboard as a secret.
      # Never commit the key to this file or to Git.
